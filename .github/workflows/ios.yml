name: iOS build

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: Logging level
        type: string
        required: true
  push:
    branches: [ "master"]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:
    name: Build RadioSpiral (including CarPlay) and run ConfigClientTests
    # The app uses iOS 27.1 APIs (hinge, reserved regions), so it needs the
    # Xcode 27 image; macos-latest only has Xcode 26.
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project RadioSpiral.xcodeproj \
            -scheme RadioSpiral \
            -destination 'platform=iOS Simulator,name=iPhone 17'
      - name: Test
        run: |
          xcodebuild test-without-building \
            -project RadioSpiral.xcodeproj \
            -scheme RadioSpiral \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:ConfigClientTests
